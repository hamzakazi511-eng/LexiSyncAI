<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4a5568"/></marker>
<marker id="ah2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c05621"/></marker></defs>
<rect width="1600" height="940" fill="#f7fafc"/>
<text x="40" y="48" font-size="26" font-weight="800" fill="#1a202c">LexiSyncAI – Evidence-Grounded Legal Document Analyst</text>
<text x="40" y="74" font-size="14" fill="#4a5568">Architecture · ingestion → hybrid retrieval → cited generation → verification / abstention · orange tags = extended features</text>
<rect x="20" y="95" width="1560" height="300" rx="14" fill="#ebf4ff" stroke="#90cdf4"/>
<text x="38" y="120" font-size="14" font-weight="800" fill="#2b6cb0">INDEX TIME  (per case, 2–5 public PDFs)</text>
<rect x="20" y="410" width="1560" height="345" rx="14" fill="#f0fff4" stroke="#9ae6b4"/>
<text x="38" y="435" font-size="14" font-weight="800" fill="#2f855a">QUERY TIME</text>
<rect x="40" y="140" width="200" height="150" rx="10" fill="#ffffff" stroke="#2d3748" stroke-width="1.6"/>
<text x="140.0" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">Upload</text>
<text x="52" y="188" font-size="12.5" fill="#2d3748">Streamlit UI: create case</text>
<text x="52" y="206" font-size="12.5" fill="#2d3748">upload 2–5 PDFs or URLs</text>
<text x="52" y="224" font-size="12.5" fill="#2d3748">(EUR-Lex, EDGAR, gov.uk)</text>
<rect x="280" y="140" width="270" height="230" rx="10" fill="#ffffff" stroke="#2d3748" stroke-width="1.6"/>
<text x="415.0" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">Ingestion · PyMuPDF</text>
<text x="292" y="188" font-size="12.5" fill="#2d3748">column-aware reading order</text>
<text x="292" y="206" font-size="12.5" fill="#2d3748">repeating header/footer removal</text>
<text x="292" y="224" font-size="12.5" fill="#2d3748">footnotes → linked to marker clause</text>
<text x="292" y="242" font-size="12.5" fill="#2d3748">tables → markdown (find_tables)</text>
<text x="292" y="260" font-size="12.5" fill="#2d3748">scanned page = no text + image</text>
<text x="292" y="278" font-size="12.5" fill="#2d3748">  → Tesseract OCR + confidence</text>
<text x="292" y="296" font-size="12.5" fill="#2d3748">every block keeps page + bbox</text>
<rect x="504" y="129" width="44" height="20" rx="10" fill="#dd6b20"/>
<text x="526" y="143" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">#1</text>
<rect x="590" y="140" width="270" height="230" rx="10" fill="#ffffff" stroke="#2d3748" stroke-width="1.6"/>
<text x="725.0" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">Clause-aware chunking</text>
<text x="602" y="188" font-size="12.5" fill="#2d3748">new chunk when structure changes:</text>
<text x="602" y="206" font-size="12.5" fill="#2d3748">Chapter / Schedule / Annex</text>
<text x="602" y="224" font-size="12.5" fill="#2d3748">Article N · paragraph → Art. 83(4)</text>
<text x="602" y="242" font-size="12.5" fill="#2d3748">Section 7 · clause 7.2 · Recital (150)</text>
<text x="602" y="260" font-size="12.5" fill="#2d3748">Table 9.1 = own chunk (caption)</text>
<text x="602" y="278" font-size="12.5" fill="#2d3748">long clause split on paragraphs</text>
<text x="602" y="296" font-size="12.5" fill="#2d3748">label + heading path prepended</text>
<rect x="900" y="140" width="250" height="230" rx="10" fill="#ffffff" stroke="#2d3748" stroke-width="1.6"/>
<text x="1025.0" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">Indexes</text>
<text x="912" y="188" font-size="12.5" fill="#2d3748">BM25 (rank-bm25)</text>
<text x="912" y="206" font-size="12.5" fill="#2d3748">  tokens keep '7.2', '83(4)'</text>
<text x="912" y="224" font-size="12.5" fill="#2d3748">Dense: all-MiniLM-L6-v2</text>
<text x="912" y="242" font-size="12.5" fill="#2d3748">  (normalised, cached .npy)</text>
<text x="912" y="260" font-size="12.5" fill="#2d3748">Chunk store: text, section,</text>
<text x="912" y="278" font-size="12.5" fill="#2d3748">  pages, spans[bbox]</text>
<rect x="1190" y="140" width="370" height="230" rx="10" fill="#ffffff" stroke="#2d3748" stroke-width="1.6"/>
<text x="1375.0" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">Page autoencoder (Conv AE)</text>
<text x="1202" y="188" font-size="12.5" fill="#2d3748">64×64 page thumbnails, unsupervised</text>
<text x="1202" y="206" font-size="12.5" fill="#2d3748">encoder 3×Conv → z(16) → decoder 3×ConvT</text>
<text x="1202" y="224" font-size="12.5" fill="#2d3748">loss = ||x − x̂||²  (denoising)</text>
<text x="1202" y="242" font-size="12.5" fill="#2d3748">robust z-score of error &gt; 2 → anomalous</text>
<text x="1202" y="260" font-size="12.5" fill="#2d3748">flags figures, scans, odd layouts</text>
<text x="1202" y="278" font-size="12.5" fill="#2d3748">→ shown in structure view,</text>
<text x="1202" y="296" font-size="12.5" fill="#2d3748">   lowers confidence of evidence there</text>
<rect x="1514" y="129" width="44" height="20" rx="10" fill="#dd6b20"/>
<text x="1536" y="143" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">#8</text>
<line x1="240" y1="215" x2="280" y2="215" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/>
<line x1="550" y1="255" x2="590" y2="255" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/>
<line x1="860" y1="255" x2="900" y2="255" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/>
<path d="M415 370 L415 385 L1375 385 L1375 370" fill="none" stroke="#4a5568" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="900" y="380" text-anchor="middle" font-size="11.5" fill="#4a5568" font-style="italic">page images</text>
<rect x="40" y="455" width="170" height="140" rx="10" fill="#ffffff" stroke="#2d3748" stroke-width="1.6"/>
<text x="125.0" y="479" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">Question</text>
<text x="52" y="503" font-size="12.5" fill="#2d3748">prose · multi-hop</text>
<text x="52" y="521" font-size="12.5" fill="#2d3748">across pages/docs ·</text>
<text x="52" y="539" font-size="12.5" fill="#2d3748">unanswerable</text>
<rect x="240" y="455" width="190" height="140" rx="10" fill="#ffffff" stroke="#2d3748" stroke-width="1.6"/>
<text x="335.0" y="479" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">Planner</text>
<text x="252" y="503" font-size="12.5" fill="#2d3748">LLM splits into ≤3</text>
<text x="252" y="521" font-size="12.5" fill="#2d3748">sub-queries (keeps</text>
<text x="252" y="539" font-size="12.5" fill="#2d3748">clause numbers);</text>
<text x="252" y="557" font-size="12.5" fill="#2d3748">heuristic w/o LLM</text>
<rect x="384" y="444" width="44" height="20" rx="10" fill="#dd6b20"/>
<text x="406" y="458" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">#5</text>
<rect x="460" y="455" width="250" height="190" rx="10" fill="#ffffff" stroke="#2d3748" stroke-width="1.6"/>
<text x="585.0" y="479" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">Hybrid retrieval</text>
<text x="472" y="503" font-size="12.5" fill="#2d3748">BM25 top-30  +  dense top-30</text>
<text x="472" y="521" font-size="12.5" fill="#2d3748">→ Reciprocal Rank Fusion</text>
<text x="472" y="539" font-size="12.5" fill="#2d3748">   score = Σ 1/(60 + rank)</text>
<text x="472" y="557" font-size="12.5" fill="#2d3748">→ cross-encoder rerank</text>
<text x="472" y="575" font-size="12.5" fill="#2d3748">   ms-marco-MiniLM (top-20)</text>
<text x="472" y="593" font-size="12.5" fill="#2d3748">→ context C1…C6</text>
<rect x="740" y="455" width="190" height="190" rx="10" fill="#fff5f5" stroke="#c53030" stroke-width="1.6"/>
<text x="835.0" y="479" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">Evidence gate</text>
<text x="752" y="503" font-size="12.5" fill="#2d3748">max evidence score</text>
<text x="752" y="521" font-size="12.5" fill="#2d3748">(CE prob + IDF cover)</text>
<text x="752" y="539" font-size="12.5" fill="#2d3748">&lt; threshold → ABSTAIN</text>
<text x="752" y="557" font-size="12.5" fill="#2d3748">states documents</text>
<text x="752" y="575" font-size="12.5" fill="#2d3748">searched</text>
<rect x="960" y="455" width="260" height="190" rx="10" fill="#ffffff" stroke="#2d3748" stroke-width="1.6"/>
<text x="1090.0" y="479" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">Generator (local LLM)</text>
<text x="972" y="503" font-size="12.5" fill="#2d3748">Ollama Llama 3.1 8B (or API)</text>
<text x="972" y="521" font-size="12.5" fill="#2d3748">answers ONLY from C1…Cn</text>
<text x="972" y="539" font-size="12.5" fill="#2d3748">JSON: answer, claims[ ],</text>
<text x="972" y="557" font-size="12.5" fill="#2d3748">each claim cites [C2]…</text>
<text x="972" y="575" font-size="12.5" fill="#2d3748">explanation + conflicts</text>
<text x="972" y="593" font-size="12.5" fill="#2d3748">(amendment prevails, etc.)</text>
<rect x="1250" y="455" width="310" height="190" rx="10" fill="#ffffff" stroke="#2d3748" stroke-width="1.6"/>
<text x="1405.0" y="479" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">Verifier</text>
<text x="1262" y="503" font-size="12.5" fill="#2d3748">claim must cite valid passage</text>
<text x="1262" y="521" font-size="12.5" fill="#2d3748">numbers ∈ cited text (2.0M = 2,000,000,</text>
<text x="1262" y="539" font-size="12.5" fill="#2d3748">  sums/differences allowed)</text>
<text x="1262" y="557" font-size="12.5" fill="#2d3748">LLM judge: entailment yes/no</text>
<text x="1262" y="575" font-size="12.5" fill="#2d3748">reject → retry log → re-plan</text>
<text x="1262" y="593" font-size="12.5" fill="#2d3748">step cap = 3; unsupported dropped</text>
<rect x="1514" y="444" width="44" height="20" rx="10" fill="#dd6b20"/>
<text x="1536" y="458" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">#5</text>
<line x1="210" y1="525" x2="240" y2="525" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/>
<line x1="430" y1="525" x2="460" y2="525" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/>
<line x1="710" y1="550" x2="740" y2="550" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/>
<line x1="930" y1="550" x2="960" y2="550" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/>
<text x="931.0" y="540.0" text-anchor="start" font-size="11.5" fill="#4a5568" font-style="italic">pass</text>
<line x1="1220" y1="550" x2="1250" y2="550" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/>
<path d="M1405 455 L1405 443 L335 443 L335 455" fill="none" stroke="#c05621" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah2)"/>
<text x="870" y="438" text-anchor="middle" font-size="12" font-weight="700" fill="#c05621">draft rejected → unsupported claims become new queries (retry)</text>
<rect x="520" y="670" width="1040" height="70" rx="10" fill="#ffffff" stroke="#2d3748" stroke-width="1.6"/>
<text x="1040.0" y="694" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c"></text>
<text x="540" y="698" font-size="15" font-weight="700" fill="#1a202c">Answer UI:</text>
<text x="630" y="698" font-size="13" fill="#2d3748">badge HIGH / MEDIUM / LOW / INSUFFICIENT · plain-language answer · claim → doc · page · clause</text>
<text x="540" y="722" font-size="13" fill="#2d3748">cited text side-by-side with the rendered page + highlighted bounding box (exact phrase / paragraph) · conflicts · retry log · latency &amp; tokens</text>
<rect x="1500" y="659" width="44" height="20" rx="10" fill="#dd6b20"/><text x="1522" y="673" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">#4</text>
<line x1="1405" y1="645" x2="1405" y2="670" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/>
<text x="1413.0" y="659.5" text-anchor="start" font-size="11.5" fill="#4a5568" font-style="italic">verified</text>
<line x1="835" y1="645" x2="835" y2="670" stroke="#c53030" stroke-width="2" marker-end="url(#ah)"/>
<text x="843.0" y="659.5" text-anchor="start" font-size="11.5" fill="#c53030" font-style="italic">abstain</text>
<rect x="20" y="775" width="1560" height="140" rx="14" fill="#faf5ff" stroke="#d6bcfa"/>
<text x="38" y="800" font-size="14" font-weight="800" fill="#6b46c1">EVALUATION  (eval/run_eval.py · ≥15 held-out questions: factual, multi-hop, unanswerable)</text>
<text x="44" y="827" font-size="13" fill="#2d3748">• Retrieval: recall@1/3/5/10 + MRR for BM25 · dense · hybrid · hybrid+rerank (rerank depth 10/20/50)</text>
<text x="44" y="848" font-size="13" fill="#2d3748">• End-to-end: answer correctness (auto proxy + manual CSV) · citation precision/recall · region (bbox) precision</text>
<text x="44" y="869" font-size="13" fill="#2d3748">• Abstention accuracy on unanswerable + false-abstention rate · comparisons: dense-only vs hybrid, no-retrieval vs retrieval, verifier on/off</text>
<text x="44" y="890" font-size="13" fill="#2d3748">• Latency mean/p50/p95 · prompt/completion tokens per question · optimisation measured: context 6 → 4 passages</text>
<rect x="1500" y="764" width="44" height="20" rx="10" fill="#dd6b20"/><text x="1522" y="778" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">#11</text>
</svg>